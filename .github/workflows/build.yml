name: Build patched BitChord

# Builds upstream's latest release with patches/*.patch applied, signs it with
# the personal key, and publishes it here. The app's own updater reads this
# repo's latest release, so the phone gets an "Update available" prompt.
on:
  schedule:
    - cron: '23 */6 * * *'   # looks for a new upstream release; a no-op costs ~10s
  push:
    branches: [main]
    paths: ['patches/**', '.github/workflows/build.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream tag to build (blank = latest release)
        required: false

permissions:
  contents: write

env:
  UPSTREAM: kushagrasinghx/BitChord

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      build: ${{ steps.pick.outputs.build }}
    steps:
      # GitHub disables scheduled workflows after 60 days without repo activity.
      - uses: actions/checkout@v5
        with: { fetch-depth: 1 }
      - name: Keep the schedule alive
        continue-on-error: true   # a rejected push (you pushed at the same moment) must not block a release build
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "bitchord-personal CI"
            git config user.email "ci@users.noreply.github.com"
            git commit --allow-empty -m "keepalive" && git push
          fi
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_IN: ${{ inputs.tag }}
          EVENT: ${{ github.event_name }}
        run: |
          tag="${TAG_IN:-$(gh release view -R "$UPSTREAM" --json tagName -q .tagName)}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # A schedule only builds a release not built yet; a push or a manual run always builds.
          # Listed on its own line so an API failure fails the step instead of reading as "0 built".
          names=$(gh release list -R "$GITHUB_REPOSITORY" -L 100 --json tagName -q ".[].tagName")
          built=$(grep -c "^$tag\." <<<"$names" || true)
          if [ "$EVENT" != schedule ] || [ "$built" = 0 ]; then echo "build=true" >> "$GITHUB_OUTPUT"; fi
          echo "upstream $tag, built here $built time(s), event $EVENT"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26.04 in Oct-Nov 2026; move on purpose
    timeout-minutes: 90
    # Here, not on the workflow: a schedule run that builds nothing must not cancel a
    # waiting patch build. A newer build replacing a waiting one is fine (it has its commits).
    concurrency:
      group: build
      cancel-in-progress: false
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: kushagrasinghx/BitChord
          # The tag, not upstream's release branch of the same name, which keeps moving.
          ref: refs/tags/${{ needs.check.outputs.tag }}
          fetch-depth: 0   # the patches' base tag, and history for the rebase
          persist-credentials: false   # no write token on disk while upstream's build scripts run
      - uses: actions/checkout@v5
        with:
          path: own
          persist-credentials: false

      - name: Apply patches
        run: |
          git config user.name "bitchord-personal CI"
          git config user.email "ci@users.noreply.github.com"
          base=$(cat own/patches/BASE)
          # On their own base the patches always apply. git am's 3-way fallback can't help on any
          # other tag (it needs blobs that exist only where the patches were made); a rebase merges
          # real commits, and drops patches upstream merged unchanged (PR #932).
          git checkout -q -B personal "refs/tags/$base"
          git am -q own/patches/*.patch || {
            echo "::error::patches/ does not apply to its own base $base: re-export it (scripts/export-patches.sh)."
            git am --show-current-patch=diff | head -80
            exit 1
          }
          if [ "$base" != "$TAG" ]; then
            git rebase -q --onto "refs/tags/$TAG" "refs/tags/$base" personal || {
              echo "::error::A patch no longer applies to $TAG. Rebase the fork branch onto $TAG and re-export patches/."
              git status --short | grep -E '^(UU|AA|DU|UD) ' || true
              git diff | head -80
              exit 1
            }
          fi

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > bitchord-release.jks
          test -s bitchord-release.jks || { echo "::error::KEYSTORE_BASE64 secret missing"; exit 1; }
          printf 'storeFile=bitchord-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          touch local.properties

      - name: Build
        # Revisions start at 100 so CI builds always outrank local test builds (1.8.1.1-99).
        run: |
          chmod +x gradlew
          ./gradlew --console=plain :app:assembleProdRelease \
            -Pbitchord.forkRevision=$((100 + ${{ github.run_number }})) -Pbitchord.bundleWear=false

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Read back from the build, so the tag is exactly what the app reports.
          version=$(jq -er '.elements[0].versionName' app/build/outputs/apk/prod/release/output-metadata.json)
          # Only the arm64 split: the updater takes a universal APK first, and that one is 170 MB.
          apk="BitChord-v${version}_arm64-v8a.apk"
          cp app/build/outputs/apk/prod/release/app-prod-arm64-v8a-release.apk "$apk"
          {
            echo "Upstream $UPSTREAM $TAG ($(git rev-parse --short "refs/tags/$TAG^{commit}")) plus:"
            git log --format='- %s' "refs/tags/$TAG"..HEAD
            echo
            echo "---"
            gh release view "$TAG" -R "$UPSTREAM" --json body -q .body || true
          } > notes.md
          gh release create "v$version" "$apk" -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "BitChord $version (personal)" --notes-file notes.md
